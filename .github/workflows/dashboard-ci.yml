name: Dashboard CI

on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - "scripts/**"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  build:
    name: Lint & build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Lint
        run: npm run lint
        working-directory: dashboard
      - name: Build
        run: npm run build
        working-directory: dashboard
